[workspace]
resolver = "3"
members = [
    "aurora",
    "meta",
    "beams",
    "build-support",
    "bursts",
    "chaos",
    "cosmos",
    "glyphs",
    "gnats",
    "hearth",
    "radar",
    "ripple",
    "storm",
    "wasm-demo",
]
exclude = ["runtime"]

[workspace.package]
# Bumped to 2.4.3 so the saver plugin .debs get new filenames.
#
# `meta` carries the repo's release version, but the artifacts that
# actually reach the apt pool are built from the plugin crates, and
# those inherit this one. Releasing without moving it rebuilds
# byte-identical .debs under a name the pool already holds, and
# `import-release.yml`'s no-clobber guard correctly refuses them:
#
#     pool already has idle-saver-aurora_2.4.2-1_amd64.deb; refusing clobber
#
# That guard is right and stays. A repo that releases must move the
# version its shipped artifacts are named after.
version = "2.4.9"
edition = "2024"
authors = ["idlescreen developers"]
license = "Apache-2.0"
repository = "https://github.com/idlescreen/savers"

[workspace.dependencies]
# `idle/` is a sibling checkout of the engine repo — CI fetches it into
# the repo root; locally bootstrap.sh symlinks it.
idle-api = { version = "3.5.0", path = "runtime/idle-api" }
build-support = { path = "build-support" }
# Bench harness. `default-features = false` drops the `rayon` parallel
# runner (we use the default single-thread runner — bench numbers stay
# deterministic across CI runner hosts). `html_reports` keeps the option
# open for maintainers who want a graph artifact.
criterion = { version = "0.5", default-features = false, features = ["html_reports"] }
# Allocation invariants. Lives in the engine repo (a sibling checkout,
# symlinked locally and fetched by CI) so one counting allocator
# serves both workspaces instead of being forked per repo.
perf-test-support = { path = "runtime/crates/perf-test-support" }

[profile.release]
# Speed, not size. These crates are the render hot path: every saver runs
# per-pixel loops for hours on battery, and `opt-level = "z"` disables loop
# vectorization and most inlining in exactly that code. The other six repos
# declare no release profile at all, so cargo's default (3) already applied
# there — the code that burns the most CPU was the only code compiled for the
# smallest binary.
opt-level = 3
lto = "fat"               # Whole-program LTO. Outperforms `lto = true` by
                          # another 2–6% on per-pixel work because LLVM can
                          # inline across saver crate boundaries.
codegen-units = 1

# `target-cpu` left at `generic` — this is a virtual workspace manifest
# and cargo rejects conditional `[target.*]` tables here. Per-arch tuning
# can be done with `.cargo/config.toml` or `CARGO_BUILD_RUSTFLAGS`.
