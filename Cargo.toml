[workspace]
resolver = "3"
members = [
    "aurora",
    "meta",
    "beams",
    "build-support",
    "bursts",
    "chaos",
    "cosmos",
    "glyphs",
    "gnats",
    "hearth",
    "radar",
    "ripple",
    "storm",
    "wasm-demo",
]
exclude = ["runtime"]

[workspace.package]
version = "2.4.2"
edition = "2024"
authors = ["idlescreen developers"]
license = "Apache-2.0"
repository = "https://github.com/idlescreen/savers"

[workspace.dependencies]
# `idle/` is a sibling checkout of the engine repo — CI fetches it into
# the repo root; locally bootstrap.sh symlinks it.
idle-api = { version = "3.3.0", path = "runtime/idle-api" }
build-support = { path = "build-support" }

[profile.release]
opt-level = "z"
lto = true
