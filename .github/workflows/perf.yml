name: Bench harness

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read

jobs:
  bench:
    name: criterion benches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Checkout runtime engine (path deps)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: idlescreen/runtime
          path: runtime
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup show || true
          if [ -f rust-toolchain.toml ]; then rustup show; else rustup default stable; fi
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libwayland-dev libxkbcommon-dev libssl-dev pkg-config libudev-dev
      - name: bench (cosmos)
        run: |
          cargo bench -p cosmos --bench tick \
            -- --warm-up-time 1 --measurement-time 3 \
            > bench-cosmos.txt 2>&1 || true
          tail -200 bench-cosmos.txt
      - name: bench (gnats)
        run: |
          cargo bench -p gnats --bench tick \
            -- --warm-up-time 1 --measurement-time 3 \
            > bench-gnats.txt 2>&1 || true
          tail -200 bench-gnats.txt
      - name: bench (bursts)
        run: |
          cargo bench -p bursts --bench tick \
            -- --warm-up-time 1 --measurement-time 3 \
            > bench-bursts.txt 2>&1 || true
          tail -200 bench-bursts.txt
      - name: bench (radar)
        run: |
          cargo bench -p radar --bench tick \
            -- --warm-up-time 1 --measurement-time 3 \
            > bench-radar.txt 2>&1 || true
          tail -200 bench-radar.txt
      - name: Upload bench artifacts
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e79e7999289bfc103d06fd04c
        with:
          name: perf-bench-results
          path: |
            bench-cosmos.txt
            bench-gnats.txt
            bench-bursts.txt
            bench-radar.txt
          retention-days: 30

      # PR-comment integration on >= 2% regression is held for a
      # follow-up commit; the comparator needs a stable baseline file.