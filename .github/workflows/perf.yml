name: Bench harness

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read
  pull-requests: write  # needed for the PR-comment integration below

jobs:
  bench:
    name: criterion benches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Every saver is T1, so the gate covers all of them. Keep this
      # list in sync with the `SAVERS` array in
      # scripts/refresh-baseline.sh and the `// perf: T1` labels.
      SAVERS: "aurora beams bursts chaos cosmos glyphs gnats hearth radar ripple storm"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Checkout runtime engine (path deps)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: idlescreen/runtime
          path: runtime
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup show || true
          if [ -f rust-toolchain.toml ]; then rustup show; else rustup default stable; fi
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libwayland-dev libxkbcommon-dev libssl-dev pkg-config libudev-dev
      # `|| true`: criterion exits non-zero when it records a change
      # against a previous run, which is not a build failure. The verdict
      # comes from compare-bench.py, which reads criterion's JSON rather
      # than trusting this exit code.
      #
      # A matrix would fan these out across runners, but then no single
      # runner would hold a comparable machine and every comparison
      # would be noise. One runner, one machine, one baseline.
      - name: bench (all savers)
        run: |
          for saver in $SAVERS; do
            echo "::group::$saver"
            cargo bench -p "$saver" --bench tick \
              -- --warm-up-time 1 --measurement-time 3 \
              > "bench-$saver.txt" 2>&1 || true
            tail -50 "bench-$saver.txt"
            echo "::endgroup::"
          done

      - name: regression check vs perf-baseline.json
        # Reads criterion's machine JSON (target/criterion/**/new/
        # estimates.json), never scraped stdout. The verdict goes to a
        # file and $GITHUB_OUTPUT so the comment step always runs.
        id: regression
        run: |
          set +e
          python3 scripts/compare-bench.py perf-baseline.json target/criterion \
            > regression.txt 2>&1
          rc=$?
          set -e
          cat regression.txt
          case "$rc" in
            0) echo "verdict=ok"        >> "$GITHUB_OUTPUT" ;;
            1) echo "verdict=regression" >> "$GITHUB_OUTPUT" ;;
            *) echo "verdict=error"      >> "$GITHUB_OUTPUT" ;;
          esac

      - name: PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const verdict = '${{ steps.regression.outputs.verdict }}';
            const body = require('fs').readFileSync('regression.txt', 'utf8');
            const tag = '<!-- perf-regression-gate -->';
            const header = verdict === 'regression'
              ? '⚠️ **Bench regression detected**'
              : verdict === 'ok'
              ? '✅ **No bench regression**'
              : '❌ **Bench comparison could not run**';
            const comment = [
              tag,
              header,
              '',
              '```',
              body.slice(0, 6000),
              '```',
              '',
              '<sub>Generated by savers/.github/workflows/perf.yml. Refresh the baseline with `scripts/refresh-baseline.sh`.</sub>'
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(tag));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment,
              });
            }

      - name: gate
        # Deliberately last and deliberately fatal: §4 promises T1
        # regressions fail the build, and the comment step above exists
        # so the author sees why. An `error` verdict is fatal too — a
        # comparison that never ran has not demonstrated anything.
        run: |
          case "${{ steps.regression.outputs.verdict }}" in
            ok)
              echo "T1 benches: no regression past threshold."
              ;;
            regression)
              echo "::error::T1 bench regression past threshold — see the PR comment and regression.txt"
              exit 1
              ;;
            *)
              echo "::error::Bench comparison did not run cleanly (missing baseline, or no parseable criterion output). Treating as failure."
              exit 1
              ;;
          esac

      - name: Upload bench artifacts
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e79e7999289bfc103d06fd04c
        with:
          name: perf-bench-results
          path: |
            bench-*.txt
            regression.txt
          retention-days: 30
