name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

# M-A31: explicit default-deny permissions per RULES §1.4.
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Checkout runtime engine (path deps)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: idlescreen/runtime
          path: runtime
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup show || true
          if [ -f rust-toolchain.toml ]; then rustup show; else rustup default stable; fi
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: file length cap (16-256 lines per page)
        # Org-wide rule from .github/RULES.md. The cross-cut excludes
        # runtime/* (engine has its own gate in idlescreen/runtime).
        run: |
          over=$(find . -name '*.rs' -not -path './target/*' -not -path './runtime/*' \
              | xargs wc -l \
              | awk '$2 != "total" && ($1 > 256 || $1 < 16)')
          if [ -n "$over" ]; then
            echo "Files outside 16-256 line range:"
            echo "$over"
            exit 1
          fi
      - name: perf labels are backed by real benches
        # Every `// perf: T1` page must name a bench target that exists
        # and actually references the page, plus a baseline to regress
        # against. The script excludes `runtime/` — the engine is
        # checked out above as a path dep and has its own gate.
        run: bash scripts/check-perf-labels.sh

      - name: bench labels are reachable
        # Same reachability gate as runtime: no page may claim
        # `check: bench` unless a bench entry point actually reaches
        # it through the module call graph.
        run: python3 scripts/check-bench-reachability.py --gate savers
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo audit (advisories)
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          cargo binstall -y cargo-audit
          cargo audit
      - name: cargo test
        run: cargo test --workspace

  bootstrap:
    # Guards the `runtime/` path-dep link in bootstrap.sh. The `test` job
    # checks the engine out into `runtime/` itself, so it cannot catch a
    # bootstrap that never creates that link — which is exactly how a symlink
    # named `idle` survived next to a Cargo.toml asking for `runtime/idle-api`
    # and broke every fresh clone. This job checks out savers ONLY and runs
    # the real script.
    name: bootstrap on a clean checkout
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup show || true
      - name: No pre-existing engine checkout
        run: |
          if [ -e runtime ]; then
            echo "::error::runtime/ already exists — this job must start from a bare savers checkout"
            exit 1
          fi
      - name: Run bootstrap.sh
        run: ./bootstrap.sh
      - name: The link exists where Cargo.toml expects it
        run: |
          test -e runtime/idle-api/Cargo.toml \
            || { echo "::error::bootstrap.sh did not produce runtime/idle-api"; exit 1; }
          cargo metadata --format-version 1 >/dev/null
          echo "bootstrap produced a resolvable runtime/ path dep"
