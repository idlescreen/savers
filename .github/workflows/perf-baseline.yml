name: Refresh perf baseline

# The perf gate compares a `cargo bench` run on a GitHub-hosted runner
# against `perf-baseline.json`. Those two numbers are only comparable if
# they came off the same kind of machine, and this workflow exists to
# guarantee that.
#
# The first real gate run made the reason concrete. The baseline had been
# captured by hand on a dev box, and CI compared it against an
# ubuntu-latest runner. On pages whose only change since capture was an
# added comment, the same benches read -38% and +47% in the same run --
# a hardware offset, not a code change. 14 of 66 T1 benches "regressed"
# and the build went red for a reason no commit could have caused.
#
# So the baseline is captured here, on the same `ubuntu-latest` label the
# gate runs on, with the same toolchain and the same system packages. The
# gate then compares runner against runner. Within-run noise on that
# runner is small, so the 5% threshold is meaningful there in a way it
# never was against a different machine.
#
# This opens a PR rather than pushing to master: a baseline bump should
# be reviewable, and the PR's own perf.yml run is the check that the new
# baseline is actually stable.

on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 05:23 UTC. Off the hour on purpose: scheduled runs
    # cluster on :00 and the runner pool is measurably noisier then.
    - cron: "23 5 * * 1"

permissions:
  contents: write         # push the baseline branch
  pull-requests: write    # open the PR

concurrency:
  group: perf-baseline
  cancel-in-progress: false

jobs:
  capture:
    name: capture baseline on ubuntu-latest
    runs-on: ubuntu-latest
    # 45, not 30, for the same reason perf.yml uses 45: eleven savers on
    # a 4-vCPU standard runner is ~21 min of bench time plus ~10 min of
    # cold compile against the runtime path dep. Thirty is a coin flip
    # here, and it would fail as an opaque timeout rather than as a perf
    # result.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # Every saver depends on `runtime/idle-api` by path. Without this
      # checkout, cargo fails to resolve the workspace and the refresh
      # script correctly refuses to write an empty baseline -- which is
      # how the first run of this workflow failed in 30 seconds.
      - name: Checkout runtime engine (path deps)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: idlescreen/runtime
          path: runtime
      - name: rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup show || true
          if [ -f rust-toolchain.toml ]; then rustup show; else rustup default stable; fi
      # Byte-for-byte the same package list as perf.yml. These savers are
      # all software-rasterised, so a different libwayland or an absent
      # font package changes the numbers and quietly invalidates every
      # comparison the gate makes.
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libwayland-dev libxkbcommon-dev libssl-dev pkg-config libudev-dev

      - name: Run all eleven saver benches and rewrite the baseline
        run: |
          scripts/refresh-baseline.sh

      - name: Publish the refreshed baseline as a PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- perf-baseline.json; then
            echo "Baseline unchanged since the last capture — nothing to publish."
            exit 0
          fi

          BRANCH="perf-baseline-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name  "jeryd"
          git config user.email "jeryd@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add perf-baseline.json
          git commit -F - <<'MSG'
          savers: refresh perf baseline on ubuntu-latest

          Captured by .github/workflows/perf-baseline.yml on the same
          `ubuntu-latest` label the perf gate runs on, with the same
          toolchain and system packages.

          This baseline replaced one captured by hand on a dev machine.
          Comparing the two produced -38%/+47% swings on pages whose only
          change was a comment, which is a hardware offset, not a
          regression. Runner-against-runner noise is far smaller, so the
          5% gate threshold is meaningful here.
          MSG
          git push --set-upstream origin "$BRANCH"

          gh pr create \
            --base master \
            --head "$BRANCH" \
            --title "savers: refresh perf baseline on ubuntu-latest" \
            --body "Automated baseline recapture from \`.github/workflows/perf-baseline.yml\`.

          Captured on \`ubuntu-latest\`, the same label \`perf.yml\` gates on,
          reading criterion's \`new/estimates.json\`.

          The previous baseline was captured on a developer machine, so the
          gate was comparing two different CPUs. This run's own
          \`perf.yml\` check on this PR is the confirmation that the new
          numbers are stable."

      - name: Upload the raw criterion output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: perf-baseline-capture
          path: target/criterion
          retention-days: 7
