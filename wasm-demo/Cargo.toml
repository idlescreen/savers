[package]
name = "wasm-demo"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Browser host shim — runs an IdleScreen saver under wasm32 for the website live demo."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.cargo-machete]
ignored = [
    "aurora",
    "beams",
    "bursts",
    "chaos",
    "cosmos",
    "glyphs",
    "gnats",
    "hearth",
    "radar",
    "ripple",
    "storm",
]

[dependencies]
aurora = { path = "../aurora", features = ["bundled"] }
beams = { path = "../beams", features = ["bundled"] }
bursts = { path = "../bursts", features = ["bundled"] }
chaos = { path = "../chaos", features = ["bundled"] }
cosmos = { path = "../cosmos", features = ["bundled"] }
glyphs = { path = "../glyphs", features = ["bundled"] }
gnats = { path = "../gnats", features = ["bundled"] }
hearth = { path = "../hearth", features = ["bundled"] }
radar = { path = "../radar", features = ["bundled"] }
ripple = { path = "../ripple", features = ["bundled"] }
storm = { path = "../storm", features = ["bundled"] }
idle-api.workspace = true
