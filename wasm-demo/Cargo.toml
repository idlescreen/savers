[package]
name = "wasm-demo"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Browser host shim — runs an IdleScreen saver under wasm32 for the website live demo."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.cargo-machete]
ignored = [
    "aurora",
    "beams",
    "bursts",
    "chaos",
    "cosmos",
    "glyphs",
    "gnats",
    "hearth",
    "radar",
    "ripple",
    "storm",
]

[dependencies]
aurora = { path = "../aurora" }
beams = { path = "../beams" }
bursts = { path = "../bursts" }
chaos = { path = "../chaos" }
cosmos = { path = "../cosmos" }
glyphs = { path = "../glyphs" }
gnats = { path = "../gnats" }
hearth = { path = "../hearth" }
radar = { path = "../radar" }
ripple = { path = "../ripple" }
storm = { path = "../storm" }
idle-api.workspace = true
